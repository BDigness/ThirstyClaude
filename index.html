<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>ThirstyClaude</title>
<style>
  :root {
    --text: #eaf1fb;
    --muted: rgba(234, 241, 251, 0.62);
    --faint: rgba(234, 241, 251, 0.45);
    --accent: #7cc4ff;
    --card: rgba(14, 18, 26, 0.66);
    --edge: rgba(255, 255, 255, 0.09);
    --glass: rgba(214, 230, 255, 0.55);
    --glass-fill: rgba(190, 215, 255, 0.16);
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
  }
  .card {
    position: absolute;
    inset: 6px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--edge);
    -webkit-app-region: drag;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 0 9px;
    box-sizing: border-box;
  }
  .stage { position: relative; width: 138px; height: 236px; flex: none; }
  .stage > svg { display: block; width: 138px; height: 236px; overflow: visible; }
  /* Hover targets over each water layer (the rest of the widget stays draggable). */
  #hits { position: absolute; inset: 0; pointer-events: none; }
  .hit { position: absolute; pointer-events: auto; -webkit-app-region: no-drag; cursor: default; }
  .tip {
    position: absolute;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 7px;
    border-radius: 6px;
    background: rgba(12, 15, 22, 0.96);
    border: 1px solid var(--edge);
    font-size: 10px;
    white-space: nowrap;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    opacity: 0;
    transition: opacity .1s;
  }
  .tip.on { opacity: 1; }
  .tip i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  .tip b { color: var(--text); font-weight: 600; }
  .info { -webkit-app-region: no-drag; text-align: center; margin-top: 2px; cursor: default; width: 100%; }
  #liters { font-size: 21px; font-weight: 600; letter-spacing: 0.2px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  #caption, #period { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  #period { color: var(--faint); font-size: 10px; }
  #period { display: flex; justify-content: center; }
  #period .pt { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #period .rate { color: var(--accent); flex: none; }
  #liters small { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  #hint { font-size: 9.5px; color: #f0b24a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  #hint:empty { display: none; }
  .levelup {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translate(-50%, -4px);
    padding: 2px 8px;
    border-radius: 9px;
    background: rgba(124, 196, 255, 0.16);
    border: 1px solid rgba(124, 196, 255, 0.28);
    font-size: 9.5px;
    white-space: nowrap;
    color: var(--text);
    opacity: 0;
    transition: opacity .3s, transform .3s;
    pointer-events: none;
  }
  .levelup.on { opacity: 1; transform: translate(-50%, 0); }
  .card.co2 .levelup { background: rgba(195, 200, 207, 0.14); border-color: rgba(195, 200, 207, 0.28); }

  .tick { stroke: rgba(230, 240, 255, 0.7); stroke-width: 1; }
  .label { fill: rgba(234, 241, 251, 0.72); font-size: 8.5px; font-variant-numeric: tabular-nums; }
  .glass { fill: none; stroke: var(--glass); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .solid { fill: var(--glass-fill); stroke: var(--glass); stroke-width: 1; stroke-linejoin: round; }

  #water { transition: transform 1.4s cubic-bezier(.2, .8, .2, 1), opacity .4s; }
  #bands rect { transition: y 1.4s cubic-bezier(.2, .8, .2, 1), height 1.4s cubic-bezier(.2, .8, .2, 1), fill .6s; }
  #range rect { transition: y 1.4s cubic-bezier(.2, .8, .2, 1), height 1.4s cubic-bezier(.2, .8, .2, 1), opacity .4s; }
  .instant, .instant * { transition: none !important; }
  .wave { animation: drift 3.4s linear infinite; transition: fill .6s; }
  .wave.back { animation-duration: 5.5s; animation-direction: reverse; opacity: 0.5; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-24px); } }
  .ripple { transform-box: fill-box; transform-origin: center; }

  /* Rubber duck: only in the bathtub, hot tub and pool */
  #duck { display: none; }
  .card.ducky #duck { display: inline; }
  #duckDrift { animation: duckDrift 11s ease-in-out infinite alternate; }
  #duckBob { animation: duckBob 2.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 80%; }
  @keyframes duckDrift { from { transform: translateX(-7px); } to { transform: translateX(7px); } }
  @keyframes duckBob { from { transform: translateY(0.5px) rotate(-4deg); } to { transform: translateY(-0.5px) rotate(4deg); } }

  /* Ice after a few idle hours: animations pause while frozen */
  #ice { transition: opacity 20s linear; }
  #cracks { transition: opacity .3s; }
  .card.frozen .wave, .card.frozen #duckDrift, .card.frozen #duckBob { animation-play-state: paused; }

  /* Boiling: steam wisps above the surface */
  #steam { display: none; transition: transform 1.4s cubic-bezier(.2, .8, .2, 1), opacity .8s; }
  .card.boiling #steam { display: inline; }
  .wisp { animation: steam 2.6s ease-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  #steamX g:nth-child(2) .wisp { animation-delay: -0.9s; }
  #steamX g:nth-child(3) .wisp { animation-delay: -1.7s; }
  @keyframes steam { 0% { transform: translateY(0) scaleX(.8); opacity: 0; } 30% { opacity: .55; } 100% { transform: translateY(-20px) scaleX(1.3); opacity: 0; } }

  /* Jar shelf: one jar per day */
  .shelf { display: none; width: 136px; margin-top: 7px; -webkit-app-region: no-drag; }
  .card.shelf7 .shelf, .card.shelf30 .shelf { display: grid; }
  .card.shelf7 .shelf { grid-template-columns: repeat(7, 1fr); gap: 0 4px; }
  .card.shelf30 .shelf { grid-template-columns: repeat(15, 1fr); gap: 3px 2px; }
  .jar {
    position: relative;
    height: 22px;
    box-sizing: border-box;
    border: 1px solid var(--glass);
    border-top: 2px solid rgba(214, 230, 255, 0.75);
    border-radius: 2px 2px 4px 4px;
    background: rgba(255, 255, 255, 0.04);
    overflow: hidden;
  }
  .card.shelf30 .jar { height: 18px; border-radius: 1px 1px 3px 3px; }
  .jar i { position: absolute; left: 0; right: 0; bottom: 0; transition: height .8s, background .6s; }
  .jw.today .jar { border-color: var(--accent); }
  .jl { font-size: 7.5px; line-height: 9px; color: var(--faint); text-align: center; }
  .jw.today .jl { color: var(--accent); }
  .card.shelf30 .jl { display: none; }
  #rig { transform-box: view-box; transform-origin: 79px 228px; }

  /* CO₂ scenes replace the vessel */
  #scene { display: none; }
  .card.co2 #scene { display: inline; }
  .card.co2 #rig, .card.co2 #source, .card.co2 #spill, .card.co2 #hits { display: none; }
  #sceneArt { transform-box: view-box; transform-origin: 69px 222px; }
  .sc-badge { fill: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }
  .sc-pct { fill: #dfe6ee; font-size: 8px; font-variant-numeric: tabular-nums; }
  .sc-unit { fill: var(--faint); font-size: 8px; letter-spacing: .4px; }
  .sc-roll text { fill: #eaf1fb; font-size: 12.5px; font-weight: 600; }
  .sc-roll.tenth text { fill: #12161d; }
  .sc-roll { transition: transform .9s cubic-bezier(.3,.7,.3,1); }
  .sc-batt { transform-box: fill-box; transform-origin: 50% 100%; }
  .sc-batt, .sc-tip, .sc-wisps, .sc-hand, .sc-sapling { transition: transform 1.4s cubic-bezier(.2,.8,.2,1); }
  .sc-paper { transition: x 1.4s cubic-bezier(.2,.8,.2,1), width 1.4s cubic-bezier(.2,.8,.2,1); }
  .sc-wedge { transition: stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1); }
  .sc-sapling { transform-box: fill-box; transform-origin: 50% 100%; }
  .sc-live { transition: opacity 2s; }
  .sc-ember { transition: fill 2s; }
  .sc-off .sc-live, .card.frozen .sc-live { opacity: 0; }
  .sc-off .sc-ember, .card.frozen .sc-ember { fill: #8f949b; }
  .sc-zzz { display: none; fill: var(--faint); font-size: 9px; letter-spacing: 1px; }
  .card.frozen .sc-zzz { display: inline; animation: scZzz 3s ease-in-out infinite alternate; }
  @keyframes scZzz { from { transform: translateY(0); opacity: .5; } to { transform: translateY(-4px); opacity: 1; } }
  .card.frozen #scene * { animation-play-state: paused; }
  .card.frozen #scene .sc-zzz { animation-play-state: running; }
  .sc-lean { transform: skewX(calc(var(--lean, 0) * 1deg)); transform-box: fill-box; transform-origin: 50% 100%; }
  /* Puffs, wisps and sparks: rise (or sink), grow (or shrink) and fade */
  .sc-puff { transform-box: fill-box; transform-origin: var(--origin, center); animation: scRise var(--dur, 3s) linear infinite; opacity: 0; }
  @keyframes scRise {
    0% { transform: translate(0, 0) scale(var(--s0, .7)); opacity: 0; }
    8% { opacity: var(--op, .7); }
    100% { transform: translate(var(--dx, 0px), var(--dy, -40px)) scale(var(--grow, 2.4)); opacity: 0; }
  }
  .sc-flame { transform-box: fill-box; transform-origin: 50% 100%; animation: scFlame .62s ease-in-out infinite alternate; }
  .sc-flame.f2 { animation-duration: .5s; }
  .sc-flame.f3 { animation-duration: .41s; }
  @keyframes scFlame { 0% { transform: scale(1, .86) skewX(-4deg); } 50% { transform: scale(.92, 1.07) skewX(2deg); } 100% { transform: scale(1.05, .94) skewX(5deg); } }
  .sc-glow { transform-box: fill-box; transform-origin: center; animation: scGlow 1.8s ease-in-out infinite alternate; }
  @keyframes scGlow { from { opacity: .55; transform: scale(.9); } to { opacity: 1; transform: scale(1.15); } }
  .sc-bolt { animation: scBlink 1.6s ease-in-out infinite alternate; }
  @keyframes scBlink { from { opacity: .5; } to { opacity: 1; } }
  .sc-idle .sc-body { animation: scIdle .13s linear infinite alternate; }
  @keyframes scIdle { from { transform: translateY(0); } to { transform: translateY(-.6px); } }
  .sc-drive .sc-body { animation: scBump .7s ease-in-out infinite; }
  @keyframes scBump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-.9px); } }
  .sc-drive .sc-spokes { transform-box: fill-box; transform-origin: center; animation: scSpin .45s linear infinite; }
  @keyframes scSpin { to { transform: rotate(360deg); } }
  .sc-road { animation: scRoad .4s linear infinite; }
  @keyframes scRoad { to { stroke-dashoffset: 16; } }
  .sc-speed path { stroke: rgba(234, 241, 251, .45); stroke-width: 1; stroke-linecap: round; animation: scSpeed .6s linear infinite; }
  @keyframes scSpeed { from { transform: translateX(6px); opacity: 0; } 30% { opacity: 1; } to { transform: translateX(-14px); opacity: 0; } }
  .sc-crown { transform-box: fill-box; transform-origin: 50% 100%; animation: scSway 5.5s ease-in-out infinite alternate; }
  @keyframes scSway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
  .sc-off .sc-spokes, .sc-off .sc-body, .sc-off .sc-road, .sc-off .sc-roll { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    .wave, #duckDrift, #duckBob, .wisp, #scene * { animation: none !important; }
    .sc-puff { display: none; }
    #water, #bands rect, #range rect { transition: none; }
  }

  .legend {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    padding: 10px 10px;
    border-radius: 16px;
    background: rgba(12, 15, 22, 0.96);
    font-size: 9.5px;
    line-height: 1.38;
    color: var(--muted);
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
    overflow: hidden;
  }
  .card.show-legend .legend { opacity: 1; }
  .lg-head { color: var(--faint); text-transform: uppercase; letter-spacing: .6px; font-size: 8.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lg-hint { color: #f0b24a; margin-top: 2px; }
  .lg-big { color: var(--text); font-size: 14px; font-weight: 600; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .lg-sec { color: var(--faint); text-transform: uppercase; letter-spacing: .6px; font-size: 8.5px; margin-top: 6px; }
  .lg-item { display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
  .lg-item i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  .lg-item .nm { flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lg-drops { display: flex; flex-wrap: wrap; gap: 0 7px; }
  .lg-drops b { font-weight: 400; margin-right: 2px; }
  .lg-foot { color: var(--faint); margin-top: 6px; font-size: 8.5px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="stage">
  <svg viewBox="0 0 138 236" aria-hidden="true">
    <defs>
      <clipPath id="vclip"><path id="vclipPath"/></clipPath>
      <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
        <stop offset="0.5" stop-color="#fff" stop-opacity="0.02"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
      </linearGradient>
      <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
        <stop offset="0.18" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
      </linearGradient>
      <radialGradient id="scPuff">
        <stop offset="0" stop-color="#d5d9df" stop-opacity="0.9"/>
        <stop offset="0.55" stop-color="#c3c8cf" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#c3c8cf" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="scSoot">
        <stop offset="0" stop-color="#6c727b" stop-opacity="0.95"/>
        <stop offset="0.6" stop-color="#5a6069" stop-opacity="0.7"/>
        <stop offset="1" stop-color="#5a6069" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="scGlow">
        <stop offset="0" stop-color="#ffb36b" stop-opacity="0.85"/>
        <stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g id="source"></g>
    <g id="rig">
      <g id="behind"></g>
      <g clip-path="url(#vclip)">
        <g id="water" style="transform: translateY(206px); opacity: 0">
          <g id="slosh">
            <g id="chopBack"><path id="waveBack" class="wave back"/></g>
            <g id="duck"><g id="duckDrift"><g id="duckBob">
              <path d="M-5.6 -1.8 L-8.4 -4.6 L-6.6 -0.4 Z" fill="#f6c445"/>
              <ellipse cx="0" cy="-1.3" rx="6.2" ry="3.5" fill="#f6c445"/>
              <path d="M-2.8 -2.3 Q0 -4.2 2.4 -2.2" fill="none" stroke="#d29a22" stroke-width="0.7" stroke-linecap="round"/>
              <circle cx="3.7" cy="-6" r="2.7" fill="#f6c445"/>
              <path d="M6 -6.4 L8.7 -5.6 L6 -4.7 Z" fill="#f08a24"/>
              <circle cx="4.5" cy="-6.6" r="0.5" fill="#1b1f27"/>
            </g></g></g>
            <g id="bands"></g>
            <rect x="-10" y="0" width="160" height="240" fill="url(#depth)"/>
            <g id="bubbles"></g>
            <g id="chopFront"><path id="waveFront" class="wave"/></g>
            <g id="ice" style="opacity: 0">
              <rect x="-10" y="-1" width="160" height="241" fill="#dff1ff" fill-opacity="0.38"/>
              <rect x="-10" y="-1.8" width="160" height="2.4" fill="#f4fbff" fill-opacity="0.85"/>
              <g id="frost"></g>
              <g id="cracks" style="opacity: 0"></g>
            </g>
          </g>
        </g>
        <g id="range">
          <rect id="rangeFill" x="-10" width="160" fill="#fff" fill-opacity="0.07"/>
          <rect id="rangeHi" x="-10" width="160" height="0.8" fill="#e6f0ff" fill-opacity="0.5"/>
          <rect id="rangeLo" x="-10" width="160" height="0.8" fill="#e6f0ff" fill-opacity="0.5"/>
        </g>
      </g>
      <g id="ticks"></g>
      <g id="front"></g>
      <g id="steam"><g id="steamX"></g></g>
      <g id="drops"></g>
    </g>
    <g id="spill"></g>
    <g id="scene"><g id="sceneArt"></g><g id="sceneFx"></g></g>
  </svg>
  <div id="hits"></div>
  <div class="levelup" id="levelup"></div>
  </div>
  <div class="tip" id="tip"></div>
  <div class="info" id="info">
    <div id="liters">…</div>
    <div id="caption">reading logs</div>
    <div id="period"></div>
    <div id="hint"></div>
  </div>
  <div class="shelf" id="shelf"></div>
  <div class="legend" id="legend"></div>
</div>
<script src="scenes.js"></script>
<script src="renderer.js"></script>
</body>
</html>
